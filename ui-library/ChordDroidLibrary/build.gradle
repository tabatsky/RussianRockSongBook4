apply plugin: 'com.android.library'

android {
    compileSdk = 37


    defaultConfig {
        minSdk 23
        targetSdk = 37
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    namespace 'com.dqt.libs.chorddroid'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
